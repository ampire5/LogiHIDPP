name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
